<style>
/* Layout: one narrow working column, sticky top bar, fixed bottom tab bar — a warehouse tool used on a phone */
:root{
  --bg:#ECEEEC; --surface:#FFFFFF; --sunk:#F5F6F4; --ink:#1B2124; --muted:#5C676B; --line:#D3D8D5;
  --accent:#E5B000; --accent-ink:#1B2124; --accent-soft:#FBF1CF;
  --ok:#2C7A4D; --ok-soft:#E1F1E7; --warn:#A86200; --warn-soft:#FBEBD3; --bad:#BC3328; --bad-soft:#F8E0DD; --info:#2D5E8C; --info-soft:#E0EAF4;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141819; --surface:#1D2326; --sunk:#181D1F; --ink:#E7ECEA; --muted:#98A3A7; --line:#2E373A;
  --accent:#F0C02E; --accent-ink:#161A1B; --accent-soft:#3A3217;
  --ok:#62C38F; --ok-soft:#1C3328; --warn:#E6A445; --warn-soft:#3A2B17; --bad:#F06D61; --bad-soft:#3D1F1C; --info:#7FB2E5; --info-soft:#1C2C3C;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141819; --surface:#1D2326; --sunk:#181D1F; --ink:#E7ECEA; --muted:#98A3A7; --line:#2E373A;
  --accent:#F0C02E; --accent-ink:#161A1B; --accent-soft:#3A3217;
  --ok:#62C38F; --ok-soft:#1C3328; --warn:#E6A445; --warn-soft:#3A2B17; --bad:#F06D61; --bad-soft:#3D1F1C; --info:#7FB2E5; --info-soft:#1C2C3C;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.mark{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:20px;flex:none;
  background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.08) 6px 9px)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.demo{display:flex;gap:8px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:9px 12px;font-size:13px;margin-bottom:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.005em;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px}h2{font-size:22px}h3{font-size:18px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
.stat.bad .v{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel>.hd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.list{list-style:none;margin:0;padding:0}
.list>li{border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.item{display:flex;gap:12px;align-items:center;padding:11px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.item:hover{background:var(--sunk)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.item .r{text-align:right;flex:none}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}
.chip.done{background:var(--sunk);color:var(--muted)}
.zone{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:5px;background:var(--ink);color:var(--surface);font-family:var(--f-display);font-weight:700;font-size:15px}
.thumb svg{width:22px;height:22px}
.thumb{width:44px;height:44px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);flex:none;object-fit:cover;display:grid;place-items:center;color:var(--muted);font-family:var(--f-display);font-weight:700;font-size:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.link{background:none;border:0;color:var(--info);font-weight:600;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
@media (min-width:620px){.facts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.facts>div{background:var(--surface);padding:10px 14px;min-width:0}
.facts dt{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.facts dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.balance{display:flex;gap:14px;align-items:center;padding:14px;flex-wrap:wrap}
.balance .v{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.balance.bad .v{color:var(--bad)}.balance.warn .v{color:var(--warn)}.balance.ok .v{color:var(--ok)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],select,textarea{font-size:16px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:42px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f>span.h{font-weight:400}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.check{width:22px;height:22px;accent-color:var(--accent);flex:none}
.zcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.zcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;text-align:left}
.zcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.zcard .z{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
nav.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .in{max-width:760px;margin:0 auto;display:flex}
nav.bar button{flex:1;border:0;background:none;padding:8px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
nav.bar button svg{width:22px;height:22px}
nav.bar button[aria-current="page"]{color:var(--ink)}
nav.bar button[aria-current="page"] svg{color:var(--accent)}
#modal{position:fixed;inset:0;z-index:20;background:rgba(10,14,15,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:620px){#modal{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:620px){.sheet{border-radius:14px}}
.sheet .hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet:focus{outline:none}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.qr{background:#fff;padding:12px;border-radius:8px;display:inline-block;border:1px solid var(--line)}
.label{display:flex;gap:14px;align-items:center;border:2px dashed var(--line);border-radius:var(--r);padding:12px;flex-wrap:wrap}
.label .code{font-family:var(--f-mono);font-size:22px;font-weight:500}
.photo{width:100%;max-width:100%;border-radius:var(--r);border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---- print labels ---- */
#print{display:none}
.lbl{box-sizing:border-box;display:flex;gap:2.5mm;align-items:center;overflow:hidden;color:#000;background:#fff;font-family:var(--f-body)}
.lbl .qrc{flex:none}
.lbl .qrc img,.lbl .qrc canvas{width:100%!important;height:auto!important}
.lbl .tx{min-width:0;display:flex;flex-direction:column;gap:.6mm}
.lbl .code{font-family:var(--f-mono);font-weight:500;line-height:1}
.lbl .nm{font-weight:600;line-height:1.1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lbl .meta{line-height:1.15;overflow:hidden;max-height:2.3em}
.p62 .lbl{width:62mm;height:29mm;padding:1.5mm 2.5mm;break-after:page;page-break-after:always}
.p62 .lbl:last-child{break-after:auto;page-break-after:auto}
.p62 .qrc{width:25mm}.p62 .code{font-size:14pt}.p62 .nm{font-size:8.5pt}.p62 .meta{font-size:7pt}
.pa4 .a4p{width:210mm;height:296mm;display:grid;grid-template-columns:repeat(3,70mm);grid-template-rows:repeat(8,37mm);align-content:center;break-after:page;page-break-after:always}
.pa4 .a4p:last-child{break-after:auto;page-break-after:auto}
.pa4 .lbl{width:70mm;height:37mm;padding:3mm 4mm}
.pa4 .qrc{width:29mm}.pa4 .code{font-size:15pt}.pa4 .nm{font-size:9.5pt}.pa4 .meta{font-size:8pt}
@media print{
  header.top,nav.bar,#app,#modal,#toast{display:none!important}
  html,body{background:#fff!important}
  :root{padding:0!important}
  body{margin:0!important}
  #print{display:block!important}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

<header class="top"><div class="in">
  <div class="brand"><div class="mark" aria-hidden="true">S</div><div><b>Stanković selidbe</b><small>Magacin · evidencija</small></div></div>
  <div class="seg" role="group" aria-label="Uloga">
    <button type="button" id="role-v" data-act="role" data-v="vlasnik">Vlasnik</button>
    <button type="button" id="role-r" data-act="role" data-v="radnik">Radnik</button>
  </div>
</div></header>
<main class="wrap" id="app"><div class="demo" style="margin-top:16px"><span><b>Aplikacija se ovde ne pokreće.</b> Ovaj prikaz ne izvršava aplikacije. Otvori link u Safariju (ili Chrome-u) da bi je koristio.</span></div></main>
<nav class="bar" aria-label="Glavni meni"><div class="in" id="nav"></div></nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>

<style id="pagestyle"></style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
const KEY='stankovic-magacin-proto-v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const DAY=864e5;
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmtD=v=>{const d=typeof v==='string'?parse(v):v;return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear()+'.'};
const fmtS=d=>pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.';
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function addMonths(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),last));return x}
function eur(n){const v=Math.round(n*100)/100;const s=Math.abs(v).toFixed(2).split('.');s[0]=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (v<0?'−':'')+s[0]+','+s[1]+' €'}
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};

/* ---------- state ---------- */
let state, ui={view:'pregled',client:null,tab:'stvari',q:'',filter:'svi',zone:'sve',mq:'',sel:new Set(),showOut:false,confirmReset:false};
/* Demo: nothing is stored. Every open or refresh starts from the example data. */
function save(){}
function load(){try{['stankovic-magacin-proto-v1','stankovic-magacin-proto-v2'].forEach(k=>localStorage.removeItem(k))}catch(e){}return null}

function seed(){
  const t=today(); let n=0;
  const D=(m,d)=>iso(addDays(addMonths(t,-m),d));
  const it=(name,zone,inDate,outDate)=>({id:uid(),code:'S-'+pad(++n).padStart(4,'0'),name,zone,photo:null,inDate,outDate:outDate||null,note:''});
  const mk=(o)=>Object.assign({id:uid(),type:'Fizičko lice',phone:'',note:'',end:null,items:[],payments:[],extras:[]},o);
  const cs=[];
  let s;
  s=D(3,-12); cs.push(mk({name:'Jelena Ilić',phone:'064 218 4410',start:s,m3:10,monthly:75,
    items:[it('Kutije – knjige','B',s),it('Kutije – knjige','B',s),it('Ormar, rastavljen','B',s),it('Krevet 160×200','B',s),it('Kutija – zimska garderoba','B',s)],
    extras:[{id:uid(),date:s,desc:'Prevoz Zemun → magacin',amount:60}],_unpaid:2,_payExtras:false}));
  s=D(2,-3); cs.push(mk({name:'Marko Petrović',phone:'063 771 902',start:s,m3:20,monthly:150,note:'Seli se u novi stan, procena 4–6 meseci.',
    items:[it('Trosed','A',s),it('Fotelja','A',s),it('Fotelja','A',s),it('Trpezarijski sto','A',s),it('Stolice (4 kom)','A',s),it('Kutije – kuhinja','A',s),it('Kutije – kuhinja','A',s),it('Veš mašina','A',s)],
    extras:[{id:uid(),date:s,desc:'Prevoz + utovar/istovar',amount:90}],_unpaid:1,_payExtras:true}));
  s=D(5,4); cs.push(mk({name:'Gradnja Plus d.o.o.',type:'Firma',phone:'011 3245 118',start:s,m3:40,monthly:300,note:'Kontakt: Dejan, magacioner.',
    items:[it('Paleta – pločice','C',s),it('Paleta – pločice','C',s),it('Paleta – lepak','C',s),it('Mešalica','C',s),it('Skele, set','D',s),it('Skele, set','D',s)],_unpaid:0}));
  s=D(0,-20); cs.push(mk({name:'Nikola Jovanović',phone:'065 900 3321',start:s,m3:20,monthly:150,
    items:[it('Klavir','A',s),it('Kutije – razno','A',s),it('Kutije – razno','A',s)],
    extras:[{id:uid(),date:s,desc:'Prevoz klavira (posebna oprema)',amount:120}],_unpaid:0,_payExtras:true}));
  s=D(12,-6); const pOut=iso(addDays(t,-40)); cs.push(mk({name:'Studio Forma',type:'Firma',phone:'060 455 0071',start:s,m3:15,monthly:112.5,
    items:[it('Sajamski štand, kutije','D',s,pOut),it('Sajamski štand, panoi','D',s),it('Rasveta, kofer','D',s),it('Stolovi sklopivi (6)','D',s,pOut)],_unpaid:0}));
  cs.forEach(c=>{const k=c.items.length,base=Math.floor(c.m3*10/k)/10;c.items.forEach((i,j)=>i.m3=j===0?Math.round((c.m3-base*(k-1))*10)/10:base);c.priceMode='auto';delete c.m3});
  cs.slice().sort((a,b)=>a.start.localeCompare(b.start)).forEach((c,k)=>{c.no=k+1;c.nextItem=1;c.items.forEach(i=>{i.code=c.no+'-'+(c.nextItem++);i.printed=true})});
  cs[3].items.forEach(i=>i.printed=false);cs[1].items.slice(-2).forEach(i=>i.printed=false);
  const st={settings:{price:7.5,grace:5,mode:'prijem',fixedDay:15,warnDays:7,zones:['A','B','C','D'],labels:'rucno'},clients:cs,log:[],nextClientNo:cs.length+1,role:'vlasnik',demo:true};
  state=st;
  cs.forEach(c=>{
    const ch=charges(c).list; const paidN=ch.length-(c._unpaid||0);
    ch.slice(0,paidN).forEach(x=>c.payments.push({id:uid(),date:iso(x.start),amount:x.amount,how:c.type==='Firma'?'Račun':'Gotovina',note:''}));
    if(c._payExtras)c.extras.forEach(e=>c.payments.push({id:uid(),date:e.date,amount:e.amount,how:'Gotovina',note:'Prevoz'}));
    delete c._unpaid;delete c._payExtras;
  });
  st.log=[
    {ts:iso(addDays(t,-40)),text:'Studio Forma – izdato 2 stavke (1-1, 1-4)'},
    {ts:cs[3].start,text:'Nikola Jovanović – primljeno 3 stavke, zona A'},
    {ts:iso(addDays(t,-2)),text:'Gradnja Plus d.o.o. – uplata 300,00 €'},

function charges(c,s){
  s=s||state.settings; const t=today(),start=parse(c.start),end=c.end?parse(c.end):null,list=[];let next=null;
  for(let k=0;k<600;k++){
    let pStart,pay,due;
    if(s.mode==='fiksni'&&k>0){pStart=new Date(start.getFullYear(),start.getMonth()+k,1);pay=new Date(pStart.getFullYear(),pStart.getMonth(),Math.min(s.fixedDay,28));due=pay}
    else{pStart=addMonths(start,k);pay=pStart;due=k===0?pStart:addDays(pStart,s.grace)}
    if(end&&pStart>=end)break;
    const pEnd=s.mode==='fiksni'?(k===0?new Date(start.getFullYear(),start.getMonth()+1,0):new Date(pStart.getFullYear(),pStart.getMonth()+1,0)):addDays(addMonths(start,k+1),-1);
    const ch={k,start:pStart,end:pEnd,pay,due,amount:pStart>t?monthlyNow(c):monthlyAt(c,pStart),m3:pStart>t?curM3(c):stockAt(c,pStart),label:'Najam '+fmtS(pStart)+' – '+fmtS(pEnd)};
    if(pStart>t){next=ch;break}
    list.push(ch);
  }
  return {list,next};
}
function money(c){
  const t=today(),s=state.settings,{list,next}=charges(c);
  const ex=(c.extras||[]).map(e=>({label:e.desc,start:parse(e.date),pay:parse(e.date),due:addDays(parse(e.date),s.grace),amount:e.amount,extra:true}));
  const all=[...list.map(x=>Object.assign({},x)),...ex].sort((a,b)=>a.due-b.due);
  const paid=(c.payments||[]).reduce((a,x)=>a+x.amount,0);
  let pool=paid,overdue=0,firstOpen=null;
  all.forEach(x=>{const p=Math.min(pool,x.amount);pool-=p;x.paid=p;x.open=x.amount-p;
    if(x.open>0.009){if(!firstOpen)firstOpen=x;if(x.due<t)overdue+=x.open}});
  const charged=all.reduce((a,x)=>a+x.amount,0),saldo=charged-paid;
  let status;
  if(c.end&&parse(c.end)<=t&&saldo<=0.009)status={k:'done',l:'Završen'};
  else if(overdue>0.009)status={k:'bad',l:'Duguje'};
  else if(saldo>0.009)status={k:'warn',l:'Čeka uplatu'};
  else if(next&&(next.pay-t)/DAY<=s.warnDays)status={k:'info',l:'Rok uskoro'};
  else status={k:'ok',l:'Uredno'};
  return {all,next,paid,charged,saldo,overdue,firstOpen,status,credit:Math.max(0,-saldo)};
}

function monthlyAt(c,d){return c.priceMode==='fiksna'?num(c.monthly):r2(stockAt(c,d)*state.settings.price)}

function vMagacin(){
  const zs=state.settings.zones,act=state.clients.filter(active);

  const qn=q.replace(/\s/g,'').replace(/[\/.]/g,'-');
  const hit=x=>{if(!q)return true;if(/^\d+$/.test(qn))return String(x.c.no)===qn;if(/^\d+-\d*$/.test(qn))return x.i.code.startsWith(qn)&&(qn.endsWith('-')||x.i.code===qn);return x.i.name.toLowerCase().includes(q)||x.c.name.toLowerCase().includes(q)};
  let res=all.filter(x=>(ui.zone==='sve'||x.i.zone===ui.zone)&&hit(x));
  res.sort((a,b)=>a.i.zone.localeCompare(b.i.zone)||a.c.no-b.c.no||parseInt(a.i.code.split('-')[1])-parseInt(b.i.code.split('-')[1]));

   <section class="panel"><div class="hd"><h3>${ui.zone==='sve'?'Sve zone':'Zona '+esc(ui.zone)}</h3><span class="spacer"></span>${ui.zone!=='sve'?'<button class="link" type="button" data-act="zone" data-v="sve">Prikaži sve</button>':''}<span class="muted num" style="font-size:13px">${res.length} stavki</span></div>
   <ul class="list">${res.length?res.map(({c,i})=>`<li><button type="button" class="item" data-act="itemInfo" data-c="${c.id}" data-id="${i.id}">
     ${i.photo?`<img class="thumb" src="${i.photo}" alt="">`:`<span class="thumb" aria-hidden="true">${esc(i.name[0])}</span>`}
     <div class="main"><div class="t">${esc(i.name)}</div><div class="s"><span class="mono">${i.code}</span> · ${esc(c.name)}</div></div><span class="zone">${esc(i.zone)}</span></button></li>`).join(''):'<li class="empty">Nema stavki.</li>'}</ul></section></div>`;

function modal(html,mount){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;mount&&mount(m);const sh=m.querySelector('.sheet');sh.scrollTop=0;
  /* on phones don't jump into a field (iOS zooms and opens the keyboard); focus the dialog itself */
  const fine=window.matchMedia&&matchMedia('(hover:hover) and (pointer:fine)').matches;
  const f=fine&&m.querySelector('input:not([type=hidden]):not([type=file]):not([type=radio]),select,textarea');
  if(f)f.focus();else{sh.setAttribute('tabindex','-1');sh.focus({preventScroll:true})}}
function close(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
const head=t=>`<div class="hd"><h2 style="flex:1">${t}</h2><button type="button" class="x" data-act="close" aria-label="Zatvori">×</button></div>`;

function resizePhoto(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,480/Math.max(img.width,img.height));const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.7))};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

   <p class="note" style="margin:0">Na komadu piše <b>${i.code}</b> (ručno ili na nalepnici). Taj broj se kuca u pretragu u tabu Magacin.</p>

   <dl class="facts panel" style="margin:0"><div><dt>Status</dt><dd>${i.outDate?'Izdato '+fmtD(i.outDate):'U magacinu'}</dd></div><div><dt>Primljeno</dt><dd>${fmtD(i.inDate)}</dd></div><div><dt>Zapremina</dt><dd>${num(i.m3)} m³</dd></div>${i.note?`<div><dt>Napomena</dt><dd>${esc(i.note)}</dd></div>`:''}</dl>
   ${i.outDate?'':`<label class="f" for="ii-m3">Zapremina (m³)<input type="number" step="0.1" min="0" id="ii-m3" value="${num(i.m3)}"></label>`}
   ${i.outDate?'':`<label class="f" for="ii-zone">Premesti u zonu<select id="ii-zone">${zs.map(z=>`<option ${z===i.zone?'selected':''}>${esc(z)}</option>`).join('')}</select></label>`}
   <div class="row"><button class="btn" type="button" data-act="printOne" data-c="${c.id}" data-id="${i.id}">Štampaj nalepnicu</button>${!i.printed&&!i.outDate?`<button class="btn" type="button" data-act="markPrinted" data-c="${c.id}" data-id="${i.id}">Označi kao odštampano</button>`:''}<button class="btn" type="button" data-act="openFromItem" data-id="${c.id}">Karton klijenta</button><button class="btn primary" type="button" data-act="close">Zatvori</button></div>
   <div id="ii-del"><button class="btn danger" type="button" id="ii-delbtn">Obriši stavku</button></div></div>`,m=>{
   const del=m.querySelector('#ii-del');
   const ask=()=>{del.innerHTML=`<div class="confirm" role="alert"><span>Da li si siguran da brišeš <b>${i.code}</b> (${esc(i.name)})? Brisanje se ne može vratiti.${!i.outDate&&isOwner()&&c.priceMode!=='fiksna'?` Mesečna cena klijenta pada na ${eur(r2((curM3(c)-num(i.m3))*state.settings.price))}.`:''}</span><span class="spacer"></span><button class="btn sm" type="button" id="ii-no">Odustani</button><button class="btn sm danger" type="button" id="ii-yes">Da, obriši</button></div>`;
     del.querySelector('#ii-no').addEventListener('click',()=>{del.innerHTML='<button class="btn danger" type="button" id="ii-delbtn">Obriši stavku</button>';del.querySelector('#ii-delbtn').addEventListener('click',ask)});
     del.querySelector('#ii-yes').addEventListener('click',()=>{c.items=c.items.filter(x=>x.id!==i.id);ui.sel.delete(i.id);log(`${c.name} – obrisana stavka ${i.code} (${i.name})`);save();close();render();toast('Stavka '+i.code+' je obrisana')});
     del.querySelector('#ii-no').focus()};
   m.querySelector('#ii-delbtn').addEventListener('click',ask);
   try{new QRCode(m.querySelector('#qrbox'),{text:i.code+' | '+c.name,width:112,height:112,colorDark:'#000000',colorLight:'#ffffff'})}catch(e){m.querySelector('#qrbox').textContent=i.code}
   const mi=m.querySelector('#ii-m3');mi&&mi.addEventListener('change',()=>{i.m3=num(mi.value);log(`${c.name} – ${i.code} zapremina ${i.m3} m³`);save();render();toast('Zapremina je izmenjena')});
   const zsel=m.querySelector('#ii-zone');zsel&&zsel.addEventListener('change',()=>{const old=i.zone;i.zone=zsel.value;log(`${c.name} – ${i.code} premešteno ${old} → ${i.zone}`);save();render();toast('Premešteno u zonu '+i.zone)});
  });
}

/* ---------- notifications (test) ---------- */
const isStandalone=()=>!!(window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));
function notifStatus(){
  if(!('Notification' in window))return isStandalone()?'Ovaj telefon ne podržava notifikacije. Na iPhoneu je potreban iOS 16.4 ili noviji.':'Na iPhoneu notifikacije rade samo kad je aplikacija otvorena sa ikonice na početnom ekranu (Safari → Share → Add to Home Screen).';
  if(Notification.permission==='denied')return 'Notifikacije su zabranjene. Uključi ih na telefonu: Podešavanja → Notifications → Magacin.';
  if(Notification.permission==='granted')return 'Notifikacije su dozvoljene. Pritisni dugme da stigne probna poruka.';
  return 'Na prvi test telefon će pitati da li dozvoljavaš notifikacije. Izaberi „Allow”.';
}
function notifyTest(delay){
  if(!('Notification' in window)){toast('Notifikacije ovde nisu dostupne');return}
  const debtor=state.clients.map(c=>({c,m:money(c)})).find(x=>x.m.status.k==='bad');
  const body=debtor?`${debtor.c.name} kasni sa uplatom · ${eur(debtor.m.saldo)}`:'Probna notifikacija iz aplikacije Magacin';
  Notification.requestPermission().then(p=>{
    render();
    if(p!=='granted'){toast('Notifikacije nisu dozvoljene');return}
    const send=()=>{
      const sw='serviceWorker' in navigator?Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(),2500))]):Promise.reject();
      sw.then(reg=>reg.showNotification('Magacin – podsetnik',{body,icon:'icon-192.png',badge:'icon-192.png',tag:'test'}))
        .catch(()=>{try{new Notification('Magacin – podsetnik',{body,icon:'icon-192.png'})}catch(e){toast('Slanje notifikacije nije uspelo')}});
    };
    if(delay>0){toast('Notifikacija stiže za '+delay+' sekundi');setTimeout(send,delay*1000)}else{send();toast('Poslato')}
  });
}

/* ---------- printing labels ---------- */
function printLabels(list,mode,skip){
  const P=$('#print');P.className=mode==='a4'?'pa4':'p62';
  $('#pagestyle').textContent=mode==='a4'?'@page{size:A4 portrait;margin:0}':'@page{size:62mm 29mm;margin:0}';
  const lbl=x=>x?`<div class="lbl"><div class="qrc" data-q="${esc(x.i.code+' | '+x.c.name)}"></div><div class="tx"><div class="code">${x.i.code}</div><div class="nm">${esc(x.c.name)}</div><div class="meta">Zona ${esc(x.i.zone)} · ${esc(x.i.name)}</div></div></div>`:'<div class="lbl"></div>';
  if(mode==='a4'){const cells=[...Array(skip).fill(null),...list],pages=[];for(let k=0;k<cells.length;k+=24)pages.push(cells.slice(k,k+24));
    P.innerHTML=pages.map(pg=>`<div class="a4p">${pg.map(lbl).join('')}</div>`).join('')}
  else P.innerHTML=list.map(lbl).join('');
  P.querySelectorAll('.qrc').forEach(el=>{try{new QRCode(el,{text:el.dataset.q,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}catch(e){}});
  setTimeout(()=>{try{window.print()}catch(e){toast('Štampanje nije dostupno u ovom prikazu')}setTimeout(()=>askPrinted(list),500)},350);
}
function writeDialog(list){
  modal(head('Obeleži primljene komade')+`<p class="note" style="margin:-6px 0 12px">Napiši broj flomasterom na papir i zalepi ga na komad. Pored broja može i ime klijenta.</p>
   <ul class="list panel" style="margin-bottom:12px">${list.map(x=>`<li><div class="item" style="cursor:default"><span class="code" style="font-family:var(--f-mono);font-size:24px;min-width:4.2em">${x.i.code}</span><div class="main"><div class="t">${esc(x.i.name)}</div><div class="s">${esc(x.c.name)} · zona ${esc(x.i.zone)}</div></div></div></li>`).join('')}</ul>
   <div class="row"><button class="btn primary" type="button" data-act="close">Gotovo, obeleženo</button><button class="btn" type="button" id="wd-print">Ipak odštampaj nalepnice</button></div>`,m=>{
   m.querySelector('#wd-print').addEventListener('click',()=>{close();printDialog(list,true)})});
}
function printDialog(list,after){
  if(!list.length)return;
  modal(head('Štampaj nalepnice')+`<p class="note" style="margin:-6px 0 12px">${list.length} ${list.length===1?'nalepnica':'nalepnica'} · ${esc([...new Set(list.map(x=>x.c.name))].join(', '))}</p>
   <form id="prf" class="stack">
    <label class="row" style="align-items:flex-start"><input type="radio" name="pm" value="a4" id="pm-a4" class="check" checked><span><b>A4 tabak – štampač u kancelariji</b><br><span class="note">24 nalepnice po listu, 3 × 8, veličine 70 × 37 mm.</span></span></label>
    <label class="row" style="align-items:flex-start"><input type="radio" name="pm" value="62" id="pm-62" class="check"><span><b>Štampač nalepnica</b><br><span class="note">Traka 62 mm, nalepnica 62 × 29 mm (npr. Brother QL). Svaka nalepnica posebno.</span></span></label>
    <label class="f" for="pr-skip" id="pr-skipw">Koliko nalepnica je već skinuto sa tabaka<input type="number" id="pr-skip" min="0" max="23" value="0"><span class="h">Štampa kreće od sledećeg slobodnog mesta, pa delimično potrošen tabak nije bačen</span></label>
    <p class="note" style="margin:0">Na iPhoneu se otvara prozor za štampu: izaberi štampač iz kancelarije (telefon i štampač moraju biti na istoj Wi-Fi mreži, štampač mora da podržava AirPrint). Na računaru isključi „Headers and footers” i podesi razmeru na 100%. Štampanje ne radi u Claude prikazu, samo kad je aplikacija otvorena preko svog linka u Safariju ili Chrome-u.</p>
    <div class="row"><button class="btn primary" type="submit">Štampaj</button><button class="btn" type="button" data-act="close">${after?'Kasnije':'Odustani'}</button></div></form>`,m=>{
    const w=m.querySelector('#pr-skipw');m.querySelectorAll('input[name=pm]').forEach(r=>r.addEventListener('change',()=>{w.hidden=m.querySelector('#pm-a4').checked===false}));
    m.querySelector('#prf').addEventListener('submit',ev=>{ev.preventDefault();const mode=m.querySelector('#pm-a4').checked?'a4':'62';const skip=Math.max(0,Math.min(23,parseInt(m.querySelector('#pr-skip').value)||0));close();printLabels(list,mode,mode==='a4'?skip:0)});
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,v=a.dataset.v;
  const c=findC(ui.client);
  switch(act){
    case 'go':ui.view=v;ui.sel.clear();ui._top=true;render();break;
    case 'role':state.role=v;save();render();toast(v==='radnik'?'Prikaz za radnika: bez novca':'Prikaz za vlasnika');break;
    case 'open':ui.client=a.dataset.id;ui.view='klijent';ui.tab='stvari';ui.sel.clear();ui.showOut=false;ui._top=true;render();break;
    case 'openFromItem':close();ui.client=a.dataset.id;ui.view='klijent';ui.tab='stvari';ui.sel.clear();ui._top=true;render();break;
    case 'tab':ui.tab=v;render();break;
    case 'filter':ui.filter=v;render();break;
    case 'zone':ui.zone=ui.zone===v?'sve':v;render();break;
    case 'sel':a.checked?ui.sel.add(a.dataset.id):ui.sel.delete(a.dataset.id);render();break;
    case 'selAll':{const ins=inStock(c);const all=ins.every(i=>ui.sel.has(i.id));ui.sel.clear();if(!all)ins.forEach(i=>ui.sel.add(i.id));render();break}
    case 'toggleOut':ui.showOut=!ui.showOut;render();break;
    case 'newClient':clientForm(null);break;
    case 'editClient':clientForm(c);break;
    case 'prijem':prijemForm(c);break;
    case 'izdaj':izdajForm(c);break;
    case 'uplata':uplataForm(c);break;
    case 'prevoz':prevozForm(c);break;
    case 'itemInfo':{const cc=findC(a.dataset.c);const it=cc&&cc.items.find(x=>x.id===a.dataset.id);it&&itemInfo(cc,it);break}
    case 'close':close();break;
    case 'psel':a.checked?ui.psel.add(a.dataset.id):ui.psel.delete(a.dataset.id);render();break;
    case 'pselAll':{const q=printQueue();const all=q.every(x=>ui.psel.has(x.i.id));ui.psel=new Set(all?[]:q.map(x=>x.i.id));render();break}
    case 'printQueue':{const q=printQueue().filter(x=>ui.psel.has(x.i.id));printDialog(q);break}
    case 'markPrinted':{const cc=findC(a.dataset.c);const it=cc&&cc.items.find(x=>x.id===a.dataset.id);if(it){it.printed=true;log(`${cc.name} – ${it.code} označeno kao odštampano`);save();close();render();toast('Označeno kao odštampano')}break}
    case 'notifyTest':notifyTest(parseInt(v)||0);break;
    case 'labels':{const ins=inStock(c);const pick=ins.filter(i=>ui.sel.has(i.id));printDialog((pick.length?pick:ins).map(i=>({c,i})));break}
    case 'printOne':{const cc=findC(a.dataset.c);const it=cc&&cc.items.find(x=>x.id===a.dataset.id);if(it){close();printDialog([{c:cc,i:it}])}break}
    case 'reset':ui.confirmReset=true;render();break;
    case 'resetNo':ui.confirmReset=false;render();break;
    case 'resetYes':ui.confirmReset=false;state=seed();save();ui.view='pregled';render();toast('Vraćeni početni primeri');break;
  }
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)close()});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;const p=e.target.selectionStart;render();const el=$('#q');el.focus();try{el.setSelectionRange(p,p)}catch(_){}}
  if(e.target.id==='mq'){ui.mq=e.target.value;const p=e.target.selectionStart;render();const el=$('#mq');el.focus();try{el.setSelectionRange(p,p)}catch(_){}}
  if(e.target.id==='s-price'){const ex=$('#s-ex');ex&&(ex.textContent='Kamion od 20 m³ = '+eur(num(e.target.value)*20)+' mesečno')}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='setForm')return;e.preventDefault();const s=state.settings;
  s.price=num($('#s-price').value)||s.price;s.warnDays=Math.max(0,parseInt($('#s-warn').value)||0);s.grace=Math.max(0,parseInt($('#s-grace').value)||0);
  s.fixedDay=Math.min(28,Math.max(1,parseInt($('#s-fixed').value)||15));s.mode=document.querySelector('input[name=mode]:checked').value;s.labels=document.querySelector('input[name=labels]:checked').value;
  const z=$('#s-zones').value.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean);if(z.length)s.zones=[...new Set(z)];
  save();render();toast('Podešavanja su sačuvana');
});

state=load()||seed();save();render();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
</script>
